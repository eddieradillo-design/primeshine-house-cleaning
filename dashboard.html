<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeShine Cleaning Dashboard</title><style>body{margin:0;background:#071c3d;color:#fff;font-family:Arial}.w{max-width:900px;margin:auto;padding:25px}.gold{color:#e2b13c}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{background:#102a55;border-radius:15px;padding:17px;margin:10px 0}.n{font-size:30px;font-weight:900}.lead{border-bottom:1px solid #29436d;padding:14px 0}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="w"><h1>Prime<span class="gold">Shine</span> Cleaning Dashboard</h1><div class="cards"><div class="c"><div class="n" id="vis">—</div>Visitors</div><div class="c"><div class="n" id="qs">—</div>Quote starts</div><div class="c"><div class="n" id="ls">—</div>Leads</div><div class="c"><div class="n" id="cv">—</div>Conversion</div></div><div class="c"><h2>Funnel · last 7 days</h2><div id="funnel"></div></div><div class="c"><h2>Recent leads</h2><div id="leads"></div></div></div><script>async function load(){let r=await fetch("/api/dashboard-data"),j=await r.json(),m=j.metrics||{};vis.textContent=m.page_view||0;qs.textContent=m.quote_start||0;ls.textContent=m.lead||0;cv.textContent=(m.page_view?Math.round((m.lead||0)/m.page_view*100):0)+"%";funnel.innerHTML=Object.entries(m).map(([k,v])=>"<div class=lead><b>"+k.replaceAll("_"," ")+"</b>: "+v+"</div>").join("");leads.innerHTML=(j.leads||[]).map(x=>"<div class=lead><b>"+x.name+"</b> · "+x.service_type+" · $"+x.quoted_price+"<br>"+x.phone+" · "+x.address+"</div>").join("")||"No leads yet."}load()</script></body></html>
