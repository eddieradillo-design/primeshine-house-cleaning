<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeShine Cleaning Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#071c3d;color:#fff;font-family:Arial,sans-serif}.w{max-width:920px;margin:auto;padding:22px 16px}.gold{color:#e2b13c}h1{font-size:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.c,.job{background:#102a55;border:1px solid #29436d;border-radius:16px;padding:16px;margin:10px 0}.n{font-size:28px;font-weight:900;color:#e2b13c}.label,.muted{color:#9db0cc}.jobname{font-size:19px;font-weight:900}.date{color:#e2b13c;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn,.actions a,.actions button{border:0;border-radius:11px;padding:12px;font-weight:800;text-align:center;text-decoration:none;font-size:14px}.primary{background:#e2b13c;color:#071c3d}.secondary{background:#1b3a68;color:#fff;border:1px solid #365681!important}.danger{background:#401f2a;color:#ff9ba8}.follow{border-left:4px solid #e2b13c}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,620px);max-height:90vh;overflow:auto;background:#0d2448;border-radius:22px 22px 0 0;padding:20px}.choice{width:100%;padding:15px;margin:6px 0;border-radius:12px;border:1px solid #365681;background:#17345f;color:#fff;font-size:16px;font-weight:800}.choice.selected{background:#e2b13c;color:#071c3d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #365681;background:#071c3d;color:#fff;font-size:16px}.frow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:8px 0;border-bottom:1px solid #29436d}summary{cursor:pointer;font-size:22px;font-weight:900;margin:24px 0 10px}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.row{display:block}.date{margin-top:5px}.actions{grid-template-columns:1fr 1fr}}
</style></head><body><div class="w"><h1>Prime<span class="gold">Shine</span> Cleaning Dashboard</h1>
<div class="cards"><div class="c"><div class="n" id="up">—</div><div class="label">Upcoming jobs</div></div><div class="c"><div class="n" id="due">—</div><div class="label">Follow-ups due</div></div><div class="c"><div class="n" id="rec">—</div><div class="label">Recurring customers</div></div><div class="c"><div class="n" id="rev">—</div><div class="label">Upcoming revenue</div></div></div>
<div class="c"><h2>Funnel · last 7 days</h2><div id="funnel"></div></div>
<h2>Upcoming Appointments</h2><div id="active"></div><h2>Follow-Ups</h2><div id="followups"></div>
<details><summary>Customer History</summary><div id="history"></div></details></div>
<div class="modal" id="completeModal"><div class="sheet"><h2 id="completeTitle">Complete Job</h2><p class="muted">Did this customer choose ongoing cleaning?</p><button class="choice selected" onclick="finishComplete('once')">One-time / No plan</button><button class="choice" onclick="finishComplete('weekly')">Every week</button><button class="choice" onclick="finishComplete('biweekly')">Every 2 weeks</button><button class="choice" onclick="finishComplete('monthly')">Every month</button><button class="choice" onclick="closeModal('completeModal')">Cancel</button></div></div>
<div class="modal" id="scheduleModal"><div class="sheet"><h2 id="scheduleTitle">Choose a new time</h2><input id="schedDate" type="date" onchange="loadTimes(this.value)"><div id="times" class="grid" style="margin-top:10px"></div><button class="choice" onclick="closeModal('scheduleModal')">Cancel</button></div></div>
<script>
const freq={once:"One-time",weekly:"Weekly",biweekly:"Every 2 weeks",monthly:"Monthly"};let jobs=[],follow=[],completeId=null,scheduleMode="",scheduleId=null,selectedTime="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>"$"+Number(v||0).toLocaleString();const fd=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});const ft=t=>{let[h,m]=t.slice(0,5).split(":").map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})};
function calUrl(x){const ds=x.appointment_date.replaceAll("-",""),st=x.appointment_time.slice(0,5).replace(":",""),h=Number(x.appointment_time.slice(0,2))+3,en=String(h).padStart(2,"0")+x.appointment_time.slice(3,5);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("PrimeShine House Cleaning | "+x.name+" | "+money(x.quoted_price))+"&dates="+ds+"T"+st+"00/"+ds+"T"+en+"00&location="+encodeURIComponent(x.address)+"&details="+encodeURIComponent("Customer: "+x.name+"\nPhone: "+x.phone+"\nCleaning: "+(x.cleaning_type||"")+"\nPrice: "+money(x.quoted_price))}
function smsUrl(x,rescheduled=false){const msg=rescheduled?"Hi "+x.name+"! This is Eddie with PrimeShine. Your house cleaning has been rescheduled to "+fd(x.appointment_date)+" at "+ft(x.appointment_time)+". See you then!":"Hi "+x.name+"! This is Eddie with PrimeShine. Your house cleaning is confirmed for "+fd(x.appointment_date)+" at "+ft(x.appointment_time)+". See you then!";return "sms:"+encodeURIComponent(x.phone)+"?body="+encodeURIComponent(msg)}
function jobCard(x,h=false){return '<div class="job '+(h?"muted":"")+'"><div class="row"><div class="jobname">'+esc(x.name)+'</div><div class="date">'+(x.appointment_date?fd(x.appointment_date)+" · "+ft(x.appointment_time):"Quote request")+'</div></div><p>'+esc(x.address)+'<br>'+esc(x.phone)+' · '+esc(x.cleaning_type||"")+' · <b>'+money(x.quoted_price)+'</b></p>'+(h?'':x.service_type==="home"?'<div class="actions"><a class="primary" target="_blank" href="'+calUrl(x)+'">📅 Add to Calendar</a><a class="primary" href="'+smsUrl(x)+'">💬 Text Customer</a><button class="secondary" onclick="openSchedule('+x.id+',\'reschedule\')">Reschedule</button><button class="secondary" onclick="openComplete('+x.id+',\''+esc(x.name).replaceAll("'","&#39;")+'\')">Complete Job</button><button class="secondary" onclick="patch('+x.id+',{action:\'archive\'})">Archive</button><button class="danger" onclick="cancelJob('+x.id+')">Cancel</button></div>':'<div class="actions"><a class="primary" href="tel:'+esc(x.phone)+'">Call Lead</a><a class="primary" href="sms:'+esc(x.phone)+'">Text Lead</a><button class="secondary" onclick="patch('+x.id+',{action:\'archive\'})">Archive</button></div>')+'</div>'}
async function load(){const r=await fetch("/api/dashboard-data"),j=await r.json();jobs=j.leads||[];follow=j.followups||[];const now=new Date(),active=jobs.filter(x=>!x.archived&&x.status!=="completed"&&x.status!=="cancelled"&&(x.service_type!=="home"||new Date(x.appointment_date+"T23:59:59")>=now)),hist=jobs.filter(x=>x.archived||x.status==="completed"||x.status==="cancelled"||(x.service_type==="home"&&new Date(x.appointment_date+"T23:59:59")<now));up.textContent=active.filter(x=>x.service_type==="home").length;due.textContent=follow.length;rec.textContent=new Set(jobs.filter(x=>x.maintenance_plan&&x.maintenance_plan!=="once").map(x=>x.phone)).size;rev.textContent=money(active.reduce((s,x)=>s+Number(x.quoted_price||0),0));document.getElementById("active").innerHTML=active.length?active.map(x=>jobCard(x)).join(""):'<div class="c muted">No active jobs.</div>';history.innerHTML=hist.length?hist.map(x=>jobCard(x,true)).join(""):'<div class="c muted">No history yet.</div>';followups.innerHTML=follow.length?follow.map(f=>'<div class="job follow"><div class="row"><div class="jobname">🔁 '+esc(f.name)+'</div><div class="date">Due '+fd(f.due_date)+'</div></div><p>'+esc(freq[f.frequency]||f.frequency)+' · Previous '+money(f.quoted_price)+'<br>'+esc(f.phone)+' · '+esc(f.address)+'</p><div class="actions"><a class="primary" href="sms:'+encodeURIComponent(f.phone)+'?body='+encodeURIComponent("Hi "+f.name+"! This is Eddie with PrimeShine. It’s time for your next house cleaning. Would you like to get your next cleaning scheduled?")+'">💬 Text Customer</a><button class="secondary" onclick="openSchedule('+f.id+',\'followup\')">Book Next Cleaning</button></div></div>').join(""):'<div class="c muted">No recurring follow-ups yet.</div>';renderFunnel(j.metrics||{})}
function renderFunnel(m){const stages=[["page_view","Visitors"],["quote_start","Started quote"],["service_selected","Service"],["price_view","Saw price"],["contact_step_view","Contact step"],["lead","Lead"],["appointment_selected","Appointment"],["booking_complete","Booked"]],first=m.page_view||0;funnel.innerHTML=stages.map((x,i)=>{const n=m[x[0]]||0,p=first?Math.round(n/first*100):0,prev=i?(m[stages[i-1][0]]||0):0,drop=i&&prev?Math.max(0,Math.round((prev-n)/prev*100)):0;return '<div class="frow"><b>'+x[1]+'</b><span>'+n+' ('+p+'%)</span><span class="muted">'+(i?'-'+drop+'% drop':'')+'</span></div>'}).join("")}
async function patch(id,body){const r=await fetch("/api/dashboard-data?id="+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),j=await r.json();if(!r.ok){alert(j.error||"Could not update");return false}load();return true}
function openComplete(id,name){completeId=id;completeTitle.textContent="Complete "+name;completeModal.classList.add("show")}async function finishComplete(frequency){if(await patch(completeId,{action:"complete",frequency}))closeModal("completeModal")}function closeModal(id){document.getElementById(id).classList.remove("show")}
function openSchedule(id,mode){scheduleId=id;scheduleMode=mode;selectedTime="";scheduleTitle.textContent=mode==="followup"?"Book Next Cleaning":"Reschedule Appointment";const d=new Date();schedDate.min=d.toISOString().slice(0,10);schedDate.value="";times.innerHTML="";scheduleModal.classList.add("show")}
async function loadTimes(date){selectedTime="";times.innerHTML='<p class="muted">Checking times…</p>';const r=await fetch("/api/availability?date="+date),j=await r.json();times.innerHTML=(j.times||[]).map(x=>'<button class="choice" '+(x.available?'onclick="chooseTime(\''+x.time+'\')"':'disabled')+'>'+ft(x.time)+(x.available?'':' · Booked')+'</button>').join("")}
async function chooseTime(t){selectedTime=t;document.querySelectorAll("#times .choice").forEach(b=>b.classList.toggle("selected",b.textContent.startsWith(ft(t))));if(confirm("Confirm "+fd(schedDate.value)+" at "+ft(t)+"?")){if(scheduleMode==="reschedule"){const ok=await patch(scheduleId,{action:"reschedule",date:schedDate.value,time:t});if(ok)closeModal("scheduleModal")}else{const r=await fetch("/api/dashboard-data?id=1",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"book_followup",followup_id:scheduleId,date:schedDate.value,time:t})}),j=await r.json();if(!r.ok)alert(j.error||"Could not book");else{closeModal("scheduleModal");load()}}}}
function cancelJob(id){if(confirm("Cancel this appointment and reopen the time?"))patch(id,{action:"cancel"})}load();
</script></body></html>
