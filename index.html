<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeShine Cleaning | Instant Quote</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#082451}.wrap{max-width:650px;margin:auto;padding:24px 18px}.logo{font-family:Georgia,serif;font-size:42px;font-weight:800;text-align:center}.logo span{color:#d9a52b}.sub{text-align:center;letter-spacing:5px;font-weight:700}.teal{color:#078ba1}.card{background:#fff;border-radius:22px;padding:25px;margin-top:22px;box-shadow:0 10px 35px #08245118}.center{text-align:center}h1{font-size:34px;margin:8px 0}.muted{color:#617086}.btn,.choice{width:100%;padding:17px;margin:8px 0;border:1px solid #dbe2ea;border-radius:14px;background:#fff;color:#082451;font-size:17px;font-weight:800;cursor:pointer}.primary{background:#d9a52b;color:#fff;border:0}.choice:hover{border-color:#078ba1}.hide{display:none}.price{font-size:48px;font-weight:900;color:#078ba1}.progress{height:7px;background:#e7edf2;border-radius:9px;overflow:hidden}.bar{height:100%;background:#d9a52b;width:0}.back{border:0;background:none;color:#617086;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.included{text-align:left;background:#f8fafc;border-radius:14px;padding:14px;margin:10px 0}.included b{display:block;margin-bottom:8px}.check{display:block;padding:4px 0}.addon{text-align:left;display:flex;justify-content:space-between;align-items:center}.selected{border-color:#078ba1;background:#eaf8fa}.small{font-size:13px}.range{font-size:38px;font-weight:900;color:#078ba1}input,select{width:100%;padding:15px;border:1px solid #ccd5df;border-radius:12px;margin:6px 0;font-size:16px}.pill{display:inline-block;background:#eaf8fa;color:#087d8f;padding:7px 11px;border-radius:20px;font-weight:700;font-size:13px}@media(max-width:500px){h1{font-size:29px}.logo{font-size:35px}}</style></head><body><div class="wrap">
<div class="logo">Prime<span>Shine</span></div><div class="sub">HOUSE CLEANING <span class="teal">SAN JOSE</span></div>
<div class="card"><div class="progress"><div class="bar" id="bar"></div></div><div id="screen" class="center"></div></div></div>
<script>
const S={step:0,type:"",beds:0,baths:0,size:0,clean:"standard",freq:"once",condition:"normal",addons:[],officeSize:0,officeFreq:"weekly",facility:"office",restrooms:1,occupants:10,price:0,low:0,high:0,address:"",cabinetSize:"",appointmentDate:"",appointmentTime:""};
const el=document.getElementById("screen"),bar=document.getElementById("bar");
const homeAddons=[["fridge","Inside refrigerator",50],["oven","Inside oven",55],["cabinets","Inside kitchen cabinets",0],["windows","Interior windows",7],["blinds","Blinds / shutters",10],["pet","Heavy pet hair",35]]; S.windowQty=0; S.blindQty=0;
function track(event){fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event,session_id:sessionStorage.psid||(sessionStorage.psid=crypto.randomUUID()),service_type:S.type,step:S.step})}).catch(()=>{})}
function go(n,event){S.step=n;if(event)track(event);show()}
function choices(arr,fn){return arr.map(x=>'<button class="choice" onclick="'+fn(x)+'">'+x[1]+'</button>').join("")}
function included(){
 const std=["Kitchen counters & sink","Exterior of appliances","Bathrooms cleaned & sanitized","Toilets, showers & tubs","Accessible surfaces dusted","Vacuum carpets","Sweep & mop floors","Trash emptied"];
 const deep=[...std,"Baseboards","Doors & door frames","Window sills","Detailed bathroom buildup","Detailed kitchen surfaces","Extra attention to buildup"];
 const move=[...std,"Baseboards","Doors & door frames","Window sills","Detailed bathroom buildup","Detailed kitchen surfaces","Extra attention to buildup","Inside empty cabinets & drawers","Inside closets","Detailed move-in / move-out reset"];
 let a=S.clean==="standard"?std:S.clean==="deep"?deep:move;
 return '<div class="included"><b>✓ What’s included</b>'+a.map(x=>'<span class="check">✓ '+x+'</span>').join("")+'</div>';
}
function show(){bar.style.width=Math.min(100,(S.type==="office"?(S.step-19)*10:S.step*9))+"%";
if(S.step===0)el.innerHTML='<span class="pill">SAN JOSE & SURROUNDING AREAS</span><h1>Get Your Cleaning Price in 30 Seconds</h1><p class="muted">Professional home & office cleaning. Simple pricing. No pressure.</p><button class="btn primary" onclick="go(1,\'quote_start\')">Get My Instant Quote →</button>';
if(S.step===1)el.innerHTML='<h2>What do you need cleaned?</h2><button class="choice" onclick="S.type=\'home\';go(2,\'service_selected\')">🏠 My Home</button><button class="choice" onclick="S.type=\'office\';go(20,\'service_selected\')">🏢 My Office</button>';
if(S.step===2)el.innerHTML='<h2>How many bedrooms?</h2>'+[1,2,3,4,5].map(x=>'<button class="choice" onclick="S.beds='+x+';go(3,\'bedrooms\')">'+x+(x===5?"+":"")+' bedrooms</button>').join("");
if(S.step===3)el.innerHTML='<h2>How many bathrooms?</h2>'+[1,2,3,4].map(x=>'<button class="choice" onclick="S.baths='+x+';go(4,\'bathrooms\')">'+x+(x===4?"+":"")+' bathrooms</button>').join("");
if(S.step===4)el.innerHTML='<h2>About how big is your home?</h2><p class="muted">No worries if you don’t know.</p>'+[[0,"I’m not sure"],[999,"Under 1,000 sq ft"],[1499,"1,000–1,499"],[1999,"1,500–1,999"],[2499,"2,000–2,499"],[2999,"2,500–2,999"],[3000,"3,000+"]].map(x=>'<button class="choice" onclick="S.size='+x[0]+';go(5,\'size\')">'+x[1]+'</button>').join("");
if(S.step===5)el.innerHTML='<h2>Choose your cleaning</h2><button class="choice" onclick="S.clean=\'standard\';go(6,\'cleaning_type\')"><b>Standard Cleaning</b><br><span class="small muted">Routine maintenance</span></button><button class="choice" onclick="S.clean=\'deep\';go(6,\'cleaning_type\')"><b>Deep Cleaning</b><br><span class="small muted">Detailed reset & buildup removal</span></button><button class="choice" onclick="S.clean=\'move\';go(6,\'cleaning_type\')"><b>Move-In / Move-Out</b><br><span class="small muted">Detailed empty-home cleaning</span></button>';
if(S.step===6)el.innerHTML='<h2>'+({standard:"Standard Cleaning",deep:"Deep Cleaning",move:"Move-In / Move-Out"}[S.clean])+'</h2>'+included()+'<button class="btn primary" onclick="go(7,\'included_viewed\')">Looks Good →</button>';
if(S.step===7)el.innerHTML='<h2>How much attention does it need?</h2><button class="choice" onclick="S.condition=\'light\';go(8,\'condition\')">Light upkeep</button><button class="choice" onclick="S.condition=\'normal\';go(8,\'condition\')">Normal lived-in</button><button class="choice" onclick="S.condition=\'extra\';go(8,\'condition\')">Needs extra attention</button><button class="choice" onclick="S.condition=\'heavy\';go(8,\'condition\')">Heavy buildup</button>';
if(S.step===8){el.innerHTML='<h2>Customize your cleaning</h2><p class="muted">Optional — only add what you need.</p>'+homeAddons.filter(a=>!(S.clean==="move"&&a[0]==="cabinets")).map(a=>'<button class="choice addon '+(S.addons.includes(a[0])?"selected":"")+'" onclick="toggleAddon(\''+a[0]+'\')"><span>'+a[1]+'</span><b>'+(S.addons.includes(a[0])?"✓ Added":(a[0]==="windows"?"$7/window":a[0]==="blinds"?"$10/blind":a[0]==="cabinets"?"Choose size":"+$"+a[2]))+'</b></button>').join("")+(S.addons.includes("cabinets")?cabinetControl():"")+(S.addons.includes("windows")?qtyControl("windows","How many interior windows?",S.windowQty):"")+(S.addons.includes("blinds")?qtyControl("blinds","How many blinds / shutters?",S.blindQty):"")+'<p class="small muted">Quantity-based add-ons are estimates. If the actual quantity is different, we’ll confirm the adjusted price before doing the extra work.</p><button class="btn primary" onclick="go(9,\'addons_complete\')">Continue →</button>'}
if(S.step===9)el.innerHTML='<h2>How often?</h2><button class="choice" onclick="S.freq=\'once\';go(10,\'frequency\')">One-Time</button><button class="choice" onclick="S.freq=\'monthly\';go(10,\'frequency\')">Monthly · Save 10%</button><button class="choice" onclick="S.freq=\'biweekly\';go(10,\'frequency\')">Every 2 Weeks · Save 15%</button><button class="choice" onclick="S.freq=\'weekly\';go(10,\'frequency\')">Weekly · Save 20%</button>';
if(S.step===10)addressStep(false);
if(S.step===11){calcHome();el.innerHTML='<p class="muted">Your estimated cleaning price</p><div class="price">$'+S.price+'</div>'+included()+(S.addons.length?'<div class="included"><b>Your add-ons</b>'+S.addons.map(id=>'<span class="check">+ '+homeAddons.find(a=>a[0]===id)[1]+(id==="windows"?' × '+S.windowQty:id==="blinds"?' × '+S.blindQty:id==="cabinets"?' · '+S.cabinetSize+' kitchen':'')+'</span>').join("")+'</div>':"")+'<p class="muted">Based on the details you provided. We’ll confirm unusual conditions or special requests before service.</p><button class="btn primary" onclick="go(12,\'price_view\')">Continue →</button>'}

if(S.step===20)el.innerHTML='<h2>What type of facility?</h2>'+[["office","Office"],["medical","Medical / Dental"],["retail","Retail"],["other","Other commercial space"]].map(x=>'<button class="choice" onclick="S.facility=\''+x[0]+'\';go(21,\'facility_type\')">'+x[1]+'</button>').join("");
if(S.step===21)el.innerHTML='<h2>Approximate facility size?</h2>'+[[0,"I’m not sure"],[999,"Under 1,000 sq ft"],[1999,"1,000–1,999"],[2999,"2,000–2,999"],[4999,"3,000–4,999"],[5000,"5,000+"]].map(x=>'<button class="choice" onclick="S.officeSize='+x[0]+';go(22,\'office_size\')">'+x[1]+'</button>').join("");
if(S.step===22)el.innerHTML='<h2>How many restrooms?</h2>'+[1,2,3,4,5].map(x=>'<button class="choice" onclick="S.restrooms='+x+';go(23,\'restrooms\')">'+x+(x===5?"+":"")+'</button>').join("");
if(S.step===23)el.innerHTML='<h2>About how many people use the space?</h2>'+[[10,"1–10"],[25,"11–25"],[50,"26–50"],[100,"51–100"],[101,"100+"]].map(x=>'<button class="choice" onclick="S.occupants='+x[0]+';go(24,\'occupancy\')">'+x[1]+'</button>').join("");
if(S.step===24)el.innerHTML='<h2>Routine office cleaning includes</h2><div class="included"><span class="check">✓ Trash removal</span><span class="check">✓ Vacuuming & mopping</span><span class="check">✓ Restroom cleaning & sanitation</span><span class="check">✓ Breakroom surfaces</span><span class="check">✓ Accessible surface dusting</span><span class="check">✓ Interior entry glass</span></div><p class="muted">Specialty floor care, carpet extraction, exterior windows and supply restocking can be added after your walkthrough.</p><button class="btn primary" onclick="go(25,\'scope_viewed\')">Continue →</button>';
if(S.step===25)el.innerHTML='<h2>How often do you need service?</h2><button class="choice" onclick="S.officeFreq=\'weekly\';go(26,\'office_frequency\')">Weekly</button><button class="choice" onclick="S.officeFreq=\'2x\';go(26,\'office_frequency\')">2× per week</button><button class="choice" onclick="S.officeFreq=\'3x\';go(26,\'office_frequency\')">3× per week</button><button class="choice" onclick="S.officeFreq=\'5x\';go(26,\'office_frequency\')">5× per week</button>';
if(S.step===26)addressStep(true);
if(S.step===27){calcOffice();el.innerHTML='<p class="muted">Estimated price per visit</p><div class="range">$'+S.low+'–$'+S.high+'</div><p class="muted">Commercial pricing is confirmed after a quick walkthrough so we can verify the exact scope and conditions.</p><button class="btn primary" onclick="go(28,\'price_view\')">Request Office Quote →</button>'}
if(S.step===28)contact("Request My Office Quote");
if(S.step===99){if(S.type==="home")el.innerHTML='<h1>You’re booked!</h1><p class="muted">Your PrimeShine cleaning is scheduled for <b>'+S.appointmentDate+'</b> at <b>'+formatTime(S.appointmentTime)+'</b>.</p><a class="btn primary" style="display:block;text-decoration:none" href="'+S.customerCalendarUrl+'" target="_blank">Add to Calendar</a><p class="small muted">We’ll contact you if we need to confirm any special details before service.</p>';else el.innerHTML='<h1>Thank you!</h1><p class="muted">PrimeShine received your office cleaning request. We’ll contact you to confirm the details.</p>'}
}
function toggleAddon(id){if(id==="cabinets"){if(!S.addons.includes(id)){S.addons.push(id);S.cabinetSize="medium"}else{S.addons=S.addons.filter(x=>x!==id);S.cabinetSize=""}}else if(id==="windows"){if(!S.addons.includes(id)){S.addons.push(id);S.windowQty=5}else{S.addons=S.addons.filter(x=>x!==id);S.windowQty=0}}else if(id==="blinds"){if(!S.addons.includes(id)){S.addons.push(id);S.blindQty=5}else{S.addons=S.addons.filter(x=>x!==id);S.blindQty=0}}else S.addons=S.addons.includes(id)?S.addons.filter(x=>x!==id):[...S.addons,id];track("addon_toggle");show()}
function cabinetControl(){return `<div class="included"><b>Choose kitchen size</b><button class="choice ${S.cabinetSize==="small"?"selected":""}" onclick="S.cabinetSize=\'small\';show()">Small · +$45</button><button class="choice ${S.cabinetSize==="medium"?"selected":""}" onclick="S.cabinetSize=\'medium\';show()">Medium · +$70</button><button class="choice ${S.cabinetSize==="large"?"selected":""}" onclick="S.cabinetSize=\'large\';show()">Large · +$100</button><p class="small muted">Pricing assumes cabinets are emptied and accessible. We’ll confirm unusually extensive cabinetry before doing the extra work.</p></div>`}
function qtyControl(id,label,qty){return '<div class="included"><b>'+label+'</b><p class="small muted">Enter the approximate number. Final price is confirmed from the actual quantity at service.</p><div class="grid"><button class="choice" onclick="changeQty(\''+id+'\',-1)">−</button><button class="choice" onclick="changeQty(\''+id+'\',1)">+ '+qty+'</button></div></div>'}
function changeQty(id,d){if(id==="windows")S.windowQty=Math.max(1,S.windowQty+d);else S.blindQty=Math.max(1,S.blindQty+d);show()}
function calcHome(){let base=149+(S.beds-1)*55+(S.baths-1)*25;if(S.size>=1500)base+=20;if(S.size>=2000)base+=30;if(S.size>=2500)base+=35;if(S.size>=3000)base+=45;if(S.clean==="deep")base+=100;if(S.clean==="move")base+=140;base*=({light:.95,normal:1,extra:1.15,heavy:1.3}[S.condition]||1);base+=S.addons.reduce((n,id)=>n+(id==="windows"?S.windowQty*7:id==="blinds"?S.blindQty*10:id==="cabinets"?({small:45,medium:70,large:100}[S.cabinetSize]||70):(homeAddons.find(a=>a[0]===id)?.[2]||0)),0);let d={once:0,monthly:.10,biweekly:.15,weekly:.20}[S.freq];S.price=Math.round(base*(1-d))}
function calcOffice(){let size=S.officeSize||1500,p=Math.max(125,size*.14);p+=Math.max(0,S.restrooms-1)*20;p*=({office:1,medical:1.2,retail:1.08,other:1.1}[S.facility]||1);if(S.occupants>50)p*=1.1;let d={weekly:0,"2x":.05,"3x":.08,"5x":.12}[S.officeFreq];p*=1-d;S.low=Math.round(p*.9/5)*5;S.high=Math.round(p*1.15/5)*5;S.price=Math.round((S.low+S.high)/2)}
function addressStep(office){el.innerHTML='<h2>Where is the '+(office?"facility":"home")+'?</h2><p class="muted">Enter the full service address so we can confirm the service area and quote details.</p><input id="street" autocomplete="street-address" placeholder="Street address"><div class="grid"><input id="city" autocomplete="address-level2" placeholder="City"><input id="zip" inputmode="numeric" autocomplete="postal-code" placeholder="ZIP code"></div><input id="state" autocomplete="address-level1" value="CA" placeholder="State"><button class="btn primary" onclick="saveAddress('+(office?27:11)+')">Continue →</button>'}
function saveAddress(next){let a=street.value.trim(),c=city.value.trim(),z=zip.value.trim(),st=state.value.trim();if(!a||!c||!z||!st){alert("Please enter the full service address.");return}S.address=a+", "+c+", "+st+" "+z;go(next,"address_complete")}
function appointmentStep(){const today=new Date(),min=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");el.innerHTML='<h2>Choose your appointment</h2><p class="muted">Select the date and preferred start time for your cleaning.</p><input id="apptDate" type="date" min="'+min+'" value="'+S.appointmentDate+'"><select id="apptTime"><option value="">Choose a time</option><option value="08:00">8:00 AM</option><option value="10:00">10:00 AM</option><option value="12:00">12:00 PM</option><option value="14:00">2:00 PM</option><option value="16:00">4:00 PM</option></select><button class="btn primary" onclick="saveAppointment()">Continue →</button>'}
function saveAppointment(){const d=document.getElementById("apptDate").value,t=document.getElementById("apptTime").value;if(!d||!t){alert("Please choose an appointment date and time.");return}S.appointmentDate=d;S.appointmentTime=t;go(13,"appointment_selected")}
function contact(label){el.innerHTML='<h2>Almost done</h2><p class="muted">Quote for <b>'+S.address+'</b></p><input id="name" autocomplete="name" placeholder="Full name"><input id="phone" autocomplete="tel" placeholder="Phone number" inputmode="tel"><input id="email" autocomplete="email" placeholder="Email (optional)"><button class="btn primary" onclick="submitLead()">'+label+'</button>'}
async function submitLead(){const nameEl=document.getElementById("name"),phoneEl=document.getElementById("phone"),emailEl=document.getElementById("email");const body={...S,name:nameEl.value.trim(),phone:phoneEl.value.trim(),email:emailEl.value.trim()};if(!body.name||!body.phone){alert("Please enter your name and phone number.");return}track("lead");const r=await fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.ok){if(S.type==="home")buildCustomerCalendar(body.name);go(99,"lead_saved")}else{let e={};try{e=await r.json()}catch{}if(r.status===409){alert(e.error||"That appointment was just booked. Please choose another time.");go(12)}else alert(e.error||"Please try again.")}}
function formatTime(t){const [h,m]=t.split(":").map(Number);return ((h+11)%12+1)+":"+String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM")}
function buildCustomerCalendar(name){const start=S.appointmentDate.replaceAll("-","")+"T"+S.appointmentTime.replace(":","")+"00",parts=S.appointmentTime.split(":").map(Number),endH=parts[0]+3,end=S.appointmentDate.replaceAll("-","")+"T"+String(endH).padStart(2,"0")+String(parts[1]).padStart(2,"0")+"00";const p=new URLSearchParams({action:"TEMPLATE",text:"PrimeShine House Cleaning",dates:start+"/"+end,location:S.address,details:"PrimeShine house cleaning for "+name+". Estimated price: $"+S.price});S.customerCalendarUrl="/calendar.html?"+p.toString()}
track("page_view");show();
</script></body></html>
