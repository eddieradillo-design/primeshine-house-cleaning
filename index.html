<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrimeShine Cleaning | Instant Quote</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#082451}.wrap{max-width:650px;margin:auto;padding:24px 18px}.logo{font-family:Georgia,serif;font-size:42px;font-weight:800;text-align:center}.logo span{color:#d9a52b}.sub{text-align:center;letter-spacing:5px;font-weight:700}.teal{color:#078ba1}.card{background:#fff;border-radius:22px;padding:25px;margin-top:22px;box-shadow:0 10px 35px #08245118}.center{text-align:center}h1{font-size:34px;margin:8px 0}.muted{color:#617086}.btn,.choice{width:100%;padding:17px;margin:8px 0;border:1px solid #dbe2ea;border-radius:14px;background:#fff;color:#082451;font-size:17px;font-weight:800;cursor:pointer}.primary{background:#d9a52b;color:#fff;border:0}.choice:hover{border-color:#078ba1}.hide{display:none}.price{font-size:48px;font-weight:900;color:#078ba1}.progress{height:7px;background:#e7edf2;border-radius:9px;overflow:hidden}.bar{height:100%;background:#d9a52b;width:0}.back{border:0;background:none;color:#617086;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;padding:15px;border:1px solid #ccd5df;border-radius:12px;margin:6px 0;font-size:16px}.pill{display:inline-block;background:#eaf8fa;color:#087d8f;padding:7px 11px;border-radius:20px;font-weight:700;font-size:13px}@media(max-width:500px){h1{font-size:29px}.logo{font-size:35px}}</style></head><body><div class="wrap">
<div class="logo">Prime<span>Shine</span></div><div class="sub">HOUSE CLEANING <span class="teal">SAN JOSE</span></div>
<div class="card"><div class="progress"><div class="bar" id="bar"></div></div><div id="screen" class="center"></div></div></div>
<script>
const S={step:0,type:"",beds:0,baths:0,size:0,clean:"standard",freq:"once",officeSize:0,officeFreq:"weekly",price:0};const el=document.getElementById("screen"),bar=document.getElementById("bar");
function track(event){fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({event,session_id:sessionStorage.psid||(sessionStorage.psid=crypto.randomUUID()),service_type:S.type,step:S.step})}).catch(()=>{})}
function show(){bar.style.width=Math.min(100,S.step*14)+"%"; if(S.step===0)el.innerHTML='<span class="pill">SAN JOSE & SURROUNDING AREAS</span><h1>Get Your Cleaning Price in 30 Seconds</h1><p class="muted">Professional home & office cleaning. Simple pricing. No pressure.</p><button class="btn primary" onclick="S.step=1;track(\'quote_start\');show()">Get My Instant Quote →</button>';
if(S.step===1)el.innerHTML='<h2>What do you need cleaned?</h2><button class="choice" onclick="S.type=\'home\';S.step=2;track(\'service_selected\');show()">🏠 My Home</button><button class="choice" onclick="S.type=\'office\';S.step=20;track(\'service_selected\');show()">🏢 My Office</button>';
if(S.step===2)el.innerHTML='<h2>How many bedrooms?</h2>'+[1,2,3,4,5].map(x=>'<button class="choice" onclick="S.beds='+x+';S.step=3;track(\'bedrooms\');show()">'+x+(x===5?'+':'')+' bedrooms</button>').join('');
if(S.step===3)el.innerHTML='<h2>How many bathrooms?</h2>'+[1,2,3,4].map(x=>'<button class="choice" onclick="S.baths='+x+';S.step=4;track(\'bathrooms\');show()">'+x+(x===4?'+':'')+' bathrooms</button>').join('');
if(S.step===4)el.innerHTML='<h2>Approximate home size?</h2>'+[[1000,'Under 1,000 sq ft'],[1500,'1,000–1,499'],[2000,'1,500–1,999'],[2500,'2,000–2,499'],[3000,'2,500+']].map(x=>'<button class="choice" onclick="S.size='+x[0]+';S.step=5;track(\'size\');show()">'+x[1]+'</button>').join('');
if(S.step===5)el.innerHTML='<h2>What type of cleaning?</h2><button class="choice" onclick="S.clean=\'standard\';S.step=6;show()">Standard Cleaning</button><button class="choice" onclick="S.clean=\'deep\';S.step=6;show()">Deep Cleaning</button><button class="choice" onclick="S.clean=\'move\';S.step=6;show()">Move-In / Move-Out</button>';
if(S.step===6)el.innerHTML='<h2>How often?</h2><button class="choice" onclick="S.freq=\'once\';price();">One-Time</button><button class="choice" onclick="S.freq=\'monthly\';price();">Monthly · Save 10%</button><button class="choice" onclick="S.freq=\'biweekly\';price();">Every 2 Weeks · Save 15%</button><button class="choice" onclick="S.freq=\'weekly\';price();">Weekly · Save 20%</button>';
if(S.step===7)el.innerHTML='<p class="muted">Your estimated cleaning price</p><div class="price">$'+S.price+'</div><p class="muted">Final price may adjust for condition or special requests.</p><button class="btn primary" onclick="S.step=8;track(\'price_view\');show()">Continue →</button>';
if(S.step===8)contact("Request My Cleaning");
if(S.step===20)el.innerHTML='<h2>Approximate office size?</h2>'+[[1000,'Under 1,000 sq ft'],[2000,'1,000–1,999'],[3000,'2,000–2,999'],[5000,'3,000–4,999'],[6000,'5,000+']].map(x=>'<button class="choice" onclick="S.officeSize='+x[0]+';S.step=21;show()">'+x[1]+'</button>').join('');
if(S.step===21)el.innerHTML='<h2>How often do you need service?</h2><button class="choice" onclick="S.officeFreq=\'weekly\';officePrice()">Weekly</button><button class="choice" onclick="S.officeFreq=\'2x\';officePrice()">2× per week</button><button class="choice" onclick="S.officeFreq=\'3x\';officePrice()">3× per week</button><button class="choice" onclick="S.officeFreq=\'5x\';officePrice()">5× per week</button>';
if(S.step===22)el.innerHTML='<p class="muted">Estimated starting price per visit</p><div class="price">$'+S.price+'</div><p class="muted">Commercial cleaning is finalized after a quick walkthrough so we can price your exact scope.</p><button class="btn primary" onclick="S.step=23;track(\'price_view\');show()">Request Office Quote →</button>';
if(S.step===23)contact("Request My Office Quote");
if(S.step===99)el.innerHTML='<h1>Thank you!</h1><p class="muted">PrimeShine received your request. We’ll contact you to confirm the details.</p>';
}
function price(){let base=149+(S.beds-1)*55+(S.baths-1)*25;if(S.size>=2000)base+=30;if(S.size>=2500)base+=35;if(S.size>=3000)base+=45;if(S.clean==="deep")base+=100;if(S.clean==="move")base+=140;let d={once:0,monthly:.10,biweekly:.15,weekly:.20}[S.freq];S.price=Math.round(base*(1-d));S.step=7;show()}
function officePrice(){let p=Math.max(120,Math.round(S.officeSize*.14));let d={weekly:0,"2x":.05,"3x":.08,"5x":.12}[S.officeFreq];S.price=Math.round(p*(1-d));S.step=22;show()}
function contact(label){el.innerHTML='<h2>Almost done</h2><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone number" inputmode="tel"><input id="address" placeholder="Service address"><input id="email" placeholder="Email"><button class="btn primary" onclick="submitLead()">'+label+'</button>'}
async function submitLead(){const body={...S,name:name.value,phone:phone.value,address:address.value,email:email.value};if(!body.name||!body.phone||!body.address){alert("Please enter your name, phone and service address.");return}track("lead");const r=await fetch("/api/lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.ok){S.step=99;show()}else alert("Please try again.")}
track("page_view");show();
</script></body></html>
